<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
       <meta charset="UTF-8">
    <meta name="description"
      content="برنامج تعليمي يعرض المنهاج السوري بشكل مبسط ومنظم، مع دروس، ملخصات، تمارين، وحلول لدعم الطلاب والمعلمين
" />

    <meta name="keywords"
      content="تعليم, كتابة يدوية, لوحة تفاعليّة,منصة التعليم السورية, نماذج امتحانات , بكالوريا, ملخصات امتحان , تاسع, مديريه التربيه سوريا , وزارة التربيه سوريا ,الأطفال, لغة عربية, لغة إنجليزية" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>document.documentElement.dataset.theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";</script>

      <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "  برنامج تعليمي يعرض المنهاج السوري بشكل مبسط ومنظم، مع دروس، ملخصات، تمارين، وحلول لدعم الطلاب والمعلمين
",
    "url": "https://mostafaaomar.github.io/school_project/",
    "description": "لوحة تفاعلية لاختبار مهارات الكتابة اليدوية للأطفال مع تعرف تلقائي للأحرف.",
    "applicationCategory": "Education",
    "operatingSystem": "All",
    "image": "https://mostafaaomar.github.io/school_project/"
  }
  </script>
    <title>اختبار الكتابة اليدوية</title>
    <link rel="stylesheet" href="../theme.css?v=7">
    <link rel="stylesheet" href="./page-design.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
</head>
<body class="handwrite-page">

   <div class="handwriting-container">
        <span class="handwriting-eyebrow">تمرين تفاعلي</span>
        <h3 id="question-text">تحميل السؤال...</h3>
        <div class="handwriting-toolbar" role="group" aria-label="أدوات الكتابة">
          <div class="pen-color-control">
            <label for="pen-color-picker">لون القلم</label>
            <input id="pen-color-picker" type="color" value="#2563eb" aria-label="اختر لون القلم" />
          </div>
          <div class="pen-color-presets" role="group" aria-label="ألوان سريعة">
            <button type="button" class="pen-color-swatch is-selected" data-color="#2563eb" aria-label="أزرق" aria-pressed="true" style="--swatch-color:#2563eb"></button>
            <button type="button" class="pen-color-swatch" data-color="#111827" aria-label="أسود" aria-pressed="false" style="--swatch-color:#111827"></button>
            <button type="button" class="pen-color-swatch" data-color="#dc2626" aria-label="أحمر" aria-pressed="false" style="--swatch-color:#dc2626"></button>
            <button type="button" class="pen-color-swatch" data-color="#16a34a" aria-label="أخضر" aria-pressed="false" style="--swatch-color:#16a34a"></button>
            <button type="button" class="pen-color-swatch" data-color="#9333ea" aria-label="بنفسجي" aria-pressed="false" style="--swatch-color:#9333ea"></button>
          </div>
          <button type="button" id="expand-canvas" class="canvas-size-button" aria-pressed="false">تكبير اللوحة</button>
          <button type="button" id="exit-canvas-fullscreen" class="canvas-size-button canvas-exit-button" hidden>العودة</button>
        </div>
        <canvas id="handwriting-canvas" aria-label="مساحة الكتابة اليدوية"></canvas>
        <div class="controls">
          <button type="button" id="clear-canvas">🗑️ مسح اللوحة</button>
          <button type="button" id="next-question">سؤال جديد</button>
        </div>

        <div id="handwriting-result"></div>
    </div>
    <script src="../js/subscripts/handwrite.js"></script>
    <script src="../shared-theme.js?v=18"></script>
</body>
</html>
