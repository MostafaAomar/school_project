<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="منصتي" />
    <meta name="description" content="كتابة — منصة التعليم السورية" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../logo.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <script>document.documentElement.dataset.theme = localStorage.getItem("theme") === "dark" ? "dark" : "light";</script>
    <title>كتابة — منصة التعليم السورية</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="../html/page-design.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../theme.css?v=7" />
  </head>
  <body class="platform-page platform-page--writing">
    <header class="topbar">
      <a class="site-brand" href="../index.html" title="الصفحة الرئيسية للمنصة">
        <img src="../images/pagelogo.png" alt="" />
        <span>منصة التعليم السورية</span>
      </a>
      <button
        type="button"
        class="mobile-menu-toggle"
        aria-controls="project-navigation-menu"
        aria-expanded="false"
        aria-label="فتح القائمة"
      >
        <span class="mobile-menu-toggle__bars" aria-hidden="true">
          <span class="mobile-menu-toggle__line"></span>
          <span class="mobile-menu-toggle__line"></span>
          <span class="mobile-menu-toggle__line"></span>
        </span>
      </button>
      <button type="button" class="theme-toggle" id="theme-toggle-btn" aria-pressed="false" aria-label="التبديل إلى الوضع الداكن">☾</button>
    </header>

    <nav id="project-navigation-menu" class="project-nav" aria-label="أقسام المنصة">
      <a href="../index.html">المواد الدراسية</a>
      <a href="../uni/index.html">أسئلة الجامعة</a>
      <a href="./plan.html">خطة الدراسة</a>
      <a href="./writing.html" aria-current="page">كتابة</a>
      <a href="./arabic.html">العربية لغير المتحدثين</a>
      <a href="../cv/index.html">إنشاء السيرة الذاتية</a>
      <a href="../transfer/index.html">نقل الملفات بين الأجهزة</a>
      <a href="./sources.html">بعض المصادر</a>
      <a href="./contact.html">اتصال</a>
    </nav>

    <div class="handwrite-page page-direct-content">
      <div class="handwriting-container">
        <span class="handwriting-eyebrow">تمرين تفاعلي</span>
        <h3 id="question-text">تحميل السؤال...</h3>

        <div class="handwriting-toolbar" role="group" aria-label="أدوات الكتابة">
          <div class="pen-color-control">
            <label for="pen-color-picker">لون القلم</label>
            <input id="pen-color-picker" type="color" value="#2563eb" aria-label="اختر لون القلم" />
          </div>
          <div class="pen-color-presets" role="group" aria-label="ألوان سريعة">
            <button type="button" class="pen-color-swatch is-selected" data-color="#2563eb" aria-label="أزرق" aria-pressed="true" style="--swatch-color:#2563eb"></button>
            <button type="button" class="pen-color-swatch" data-color="#111827" aria-label="أسود" aria-pressed="false" style="--swatch-color:#111827"></button>
            <button type="button" class="pen-color-swatch" data-color="#dc2626" aria-label="أحمر" aria-pressed="false" style="--swatch-color:#dc2626"></button>
            <button type="button" class="pen-color-swatch" data-color="#16a34a" aria-label="أخضر" aria-pressed="false" style="--swatch-color:#16a34a"></button>
            <button type="button" class="pen-color-swatch" data-color="#9333ea" aria-label="بنفسجي" aria-pressed="false" style="--swatch-color:#9333ea"></button>
          </div>
          <button type="button" id="expand-canvas" class="canvas-size-button" aria-pressed="false">
            <i class="fa-solid fa-expand" aria-hidden="true"></i>
            تكبير اللوحة
          </button>
          <button type="button" id="exit-canvas-fullscreen" class="canvas-size-button canvas-exit-button" hidden>
            <i class="fa-solid fa-compress" aria-hidden="true"></i>
            العودة
          </button>
        </div>

        <canvas id="handwriting-canvas" aria-label="مساحة الكتابة اليدوية"></canvas>
        <div class="controls">
          <button type="button" id="clear-canvas">🗑️ مسح اللوحة</button>
          <button type="button" id="next-question">سؤال جديد</button>
        </div>
        <div id="handwriting-result"></div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>
    <script src="../js/subscripts/handwrite.js"></script>
    <script src="../shared-theme.js?v=18"></script>
  </body>
</html>
