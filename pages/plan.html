<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="نصائح وخطط للدراسة بشكل منظم وفعّال." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="منصتي" />
    <link rel="icon" href="../icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../logo.png" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <script>
      document.documentElement.dataset.theme =
        localStorage.getItem("theme") === "dark" ? "dark" : "light";
    </script>
    <title>خطة الدراسة — منصة التعليم السورية</title>
    <link rel="stylesheet" href="../styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../theme.css?v=6" />
  </head>
  <body class="platform-page platform-page--plan">
    <header class="topbar">
      <a class="site-brand" href="../index.html" title="الصفحة الرئيسية للمنصة">
        <img src="../images/pagelogo.png" alt="" />
        <span>منصة التعليم السورية</span>
      </a>
      <button
        type="button"
        class="mobile-menu-toggle"
        aria-controls="project-navigation-menu"
        aria-expanded="false"
        aria-label="فتح القائمة"
      >
        <span class="mobile-menu-toggle__bars" aria-hidden="true">
          <span class="mobile-menu-toggle__line"></span>
          <span class="mobile-menu-toggle__line"></span>
          <span class="mobile-menu-toggle__line"></span>
        </span>
      </button>
      <button type="button" class="theme-toggle" id="theme-toggle-btn" aria-pressed="false">☾</button>
    </header>

    <nav id="project-navigation-menu" class="project-nav" aria-label="أقسام المنصة">
      <a href="../index.html">المواد الدراسية</a>
      <a href="../uni/index.html">أسئلة الجامعة</a>
      <a href="../pages/plan.html" aria-current="page">خطة الدراسة</a>
      <a href="../pages/writing.html">كتابة</a>
      <a href="../pages/arabic.html">العربية لغير المتحدثين</a>
      <a href="../cv/index.html">إنشاء السيرة الذاتية</a>
      <a href="../transfer/index.html">نقل الملفات بين الأجهزة</a>
      <a href="../pages/sources.html">بعض المصادر</a>
      <a href="../pages/contact.html">اتصال</a>
    </nav>

    <main class="container advice-page">
      <h2 class="section-title"><i class="fas fa-lightbulb"></i> نصائح الدراسة</h2>
      <div id="advice-content-display-area">
        <p class="info-message">جاري تحميل النصائح...</p>
      </div>
    </main>
    <script type="module">
      import { displayAdviceContent } from "../js/components/advice_display.js";
      import { initializeAutoDirection } from "../js/utils/language_direction.js";

      const container = document.getElementById("advice-content-display-area");
      initializeAutoDirection();
      try {
        const response = await fetch("../data/advice_content.json");
        if (!response.ok) throw new Error("HTTP " + response.status);
        displayAdviceContent(await response.json(), container);
      } catch (error) {
        console.error("Could not load study advice:", error);
        container.innerHTML = '<p class="info-message">لم يتم تحميل نصائح الدراسة.</p>';
      }
    </script>

    <script src="../shared-theme.js?v=18"></script>
  </body>
</html>
